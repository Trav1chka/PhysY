[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "physy"
version = "0.0.0"
description = ''
readme = "README.md"
requires-python = ">=3.8"
keywords = []
authors = [
  { name = "U.N. Owen", email = "void@some.where" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "pyglet>=2.1.19",
]

[project.urls]
Documentation = "https://github.com/U.N. Owen/physy#readme"
Issues = "https://github.com/U.N. Owen/physy/issues"
Source = "https://github.com/U.N. Owen/physy"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/physy"]

[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/physy tests}"

[tool.coverage.run]
source_pkgs = ["physy"]
branch = true
parallel = true

[tool.coverage.paths]
physy = ["src"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
